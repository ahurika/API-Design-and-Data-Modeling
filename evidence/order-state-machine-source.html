<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;}
  text{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
  <title>Order state machine</title>

  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Order lifecycle state machine (REQ-ORDER-002)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Terminal states: COMPLETED and CANCELLED. No backward transitions allowed.</text>

  <!-- PENDING -->
  <rect x="80"  y="170" width="150" height="60" rx="30"  fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="155" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">PENDING</text>

  <!-- CONFIRMED -->
  <rect x="390" y="170" width="160" height="60" rx="30" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="470" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">CONFIRMED</text>

  <!-- COMPLETED -->
  <rect x="700" y="110" width="180" height="60" rx="30" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="790" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">COMPLETED</text>

  <!-- CANCELLED -->
  <rect x="700" y="290" width="180" height="60" rx="30" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="790" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">CANCELLED</text>

  <!-- start dot -->
  <circle cx="60" cy="200" r="8" fill="#111827"/>
  <line x1="68" y1="200" x2="80" y2="200" stroke="#111827" stroke-width="2"/>
  <text x="42" y="188" font-size="11" fill="#374151">start</text>

  <!-- PENDING -> CONFIRMED -->
  <line x1="230" y1="200" x2="390" y2="200" stroke="#111827" stroke-width="1.6"/>
  <polygon points="390,195 402,200 390,205" fill="#111827"/>
  <text x="310" y="193" text-anchor="middle" font-size="12" fill="#374151">confirm</text>

  <!-- CONFIRMED -> COMPLETED -->
  <line x1="560" y1="190" x2="700" y2="140" stroke="#111827" stroke-width="1.6"/>
  <polygon points="700,137 712,134 700,146" fill="#111827"/>
  <text x="640" y="155" text-anchor="middle" font-size="12" fill="#047857">complete</text>

  <!-- PENDING -> CANCELLED -->
  <line x1="165" y1="230" x2="790" y2="290" stroke="#b91c1c" stroke-width="1.6"/>
  <polygon points="789,297 800,290 783,289" fill="#b91c1c"/>
  <text x="430" y="272" text-anchor="middle" font-size="12" fill="#b91c1c">cancel</text>

  <!-- CONFIRMED -> CANCELLED -->
  <line x1="500" y1="230" x2="760" y2="290" stroke="#b91c1c" stroke-width="1.6"/>
  <polygon points="760,297 771,290 754,289" fill="#b91c1c"/>
  <text x="610" y="282" text-anchor="middle" font-size="12" fill="#b91c1c">cancel</text>

  <!-- terminal markers -->
  <circle cx="790" cy="118" r="3" fill="#047857"/>
  <text x="790" y="104" text-anchor="middle" font-size="11" fill="#047857">terminal</text>
  <circle cx="790" cy="298" r="3" fill="#b91c1c"/>
  <text x="790" y="282" text-anchor="end" font-size="11" fill="#b91c1c">terminal</text>

  <!-- forbidden transitions -->
  <text x="340" y="420" text-anchor="middle" font-size="13" fill="#b91c1c">
    Forbidden (422): CANCELLED → any · COMPLETED → any · backward moves are rejected by the app layer.
  </text>
</svg>
</body>
</html>
